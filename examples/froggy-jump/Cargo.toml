[package]
name = "froggy-jump"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimal Doodle Jump-style game - WASM compatible"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gravita-math = { workspace = true }

# WASM dependencies
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CanvasRenderingContext2d",
    "Window",
    "KeyboardEvent",
    "Performance",
    "console",
]

